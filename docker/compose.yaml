# A remote login for Liminal: the login app alone (Dockerfile) and its https front (Caddyfile), for the platform to set
# up on the Docker engine it picks (the user, 2026-11-10: "the platform app will be able to setup docker instances";
# "just prepare for using docker on platform as a way to login remotely with only the login-app"). By hand, from this
# folder: `docker compose up -d --build`. Other logins then reach its users as name@<its domain>: their [remotes] names
# https://<LIMINAL_REMOTE_HOST>:<LIMINAL_REMOTE_PORT>, and LIMINAL_LOGIN_CA trusts the front's own authority, copied out
# once with `docker compose cp front:/data/caddy/pki/authorities/local/root.crt ./front-root.crt`.
name: liminal-login-remote

services:
  login:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        libs: ../../common          # liminal-libs' checkout beside this one (source/liminal/common)
    volumes:
      - login-data:/data
      - ./liminal-login.cfg:/config/liminal-login.cfg:ro
    ports:
      - "${LIMINAL_REMOTE_PORT:-8443}:8443"   # the front's port: published from this network, which the front shares
    restart: unless-stopped

  front:
    image: caddy:2.10-alpine
    network_mode: "service:login"   # the login's own network: the app still answers only 127.0.0.1
    environment:
      LIMINAL_REMOTE_HOST: ${LIMINAL_REMOTE_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - front-data:/data
    depends_on:
      - login
    restart: unless-stopped

volumes:
  login-data:
  front-data:
