[login]
; a remote login in Docker (compose.yaml): the login of a domain, the https host its front answers at. compose.yaml says
; which (LIMINAL_LOGIN_SCOPE, from LIMINAL_REMOTE_HOST), over this line. Nobody comes in without a password and no
; account is made without a session: the first user is made inside the container
; (`docker compose exec login liminal-login user add NAME`), and other logins reach its users as name@<its host>
scope = https://localhost
title = Liminal (remote)
port = 8795
; sign-up by email: closed. `signup = open` lets a code mailed to an address at the host make an account, once the host
; has an email server (its MX record, or one named under [mail]); read when the login starts. compose.yaml says closed
; too (LIMINAL_LOGIN_SIGNUP), for a copy of this file without the line, and this line is over it. What opening it means
; is in the README's Docker steps
signup = closed

[mail]
; no mail account set: with `signup = open` the codes go through the host's own mail server (its MX record), unless one
; is named here
